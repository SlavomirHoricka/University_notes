[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "uni-learning-hub"
version = "0.1.0"
description = "Local personal learning hub"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = ["ruff>=0.11,<1", "mypy>=1.15,<2", "pytest>=8.3,<10", "httpx>=0.28,<1", "build>=1.2,<2", "hatchling>=1.27,<2"]

[tool.hatch.build.targets.wheel]
packages = ["backend/learning_hub"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contracts", "tests/integration"]
addopts = "--strict-markers --strict-config"
