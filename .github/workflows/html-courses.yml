name: Publish HTML courses

on:
  push:
    branches: [main]
    paths:
      - '02_Resources/HTML_Courses/**'
      - '.github/workflows/html-courses.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: 02_Resources/HTML_Courses
      - name: Deploy courses
        id: deployment
        uses: actions/deploy-pages@v4
