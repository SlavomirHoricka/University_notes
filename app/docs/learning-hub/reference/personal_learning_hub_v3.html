<div id="modalRoot"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  const KEY='learnspace-hub-data-v2';
  const $=sel=>document.querySelector(sel);
  const icon=(name, cls='')=>`<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dateISO=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const addDays=(n,date=new Date())=>{let d=new Date(date.getFullYear(),date.getMonth(),date.getDate());d.setDate(d.getDate()+n);return dateISO(d)};
  const parseDate=s=>new Date(`${s}T12:00:00`);
  const fmtDate=(s,ops={month:'short',day:'numeric'})=>parseDate(s).toLocaleDateString('en-US',ops);
  const uid=()=>`${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}`;
  // New installations start with genuine zero values rather than demonstration statistics.
  const seed=()=>({
    profile:{name:'Learner',weeklyGoal:0,theme:'light'},
    courses:[], tasks:[], notes:[], activity:{}, sessions:0
  });
  let data;
  try {
    const stored=JSON.parse(localStorage.getItem(KEY)||'null');
    data=stored?.profile&&Array.isArray(stored.courses)&&Array.isArray(stored.tasks)&&Array.isArray(stored.notes)&&stored.activity&&typeof stored.activity==='object'?stored:seed();
  } catch(e) {data=seed()}
  data.profile.name=String(data.profile.name||'Learner');
  data.profile.weeklyGoal=Math.max(0,Number(data.profile.weeklyGoal)||0);
  data.courses=data.courses.map(c=>({...c,weeks:Math.max(1,Math.min(104,Number(c.weeks)||12))}));
  let view='overview', previousView='overview',courseFilter='All',taskFilter='Upcoming',selectedCourse='',searchTerm='',selectedDay=dateISO(),monthCursor=new Date(new Date().getFullYear(),new Date().getMonth(),1),notifOpen=false;
  let timerLength=25,timerSeconds=25*60,timerRunning=false,timerId=null,toastId=null;
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){toast('Cannot save changes. Enable browser site storage or free some space.',true);return false}};
  const courseOf=id=>data.courses.find(c=>c.id===id);
  const progress=c=>Math.round(100*Math.min(c.completed,c.lessons)/Math.max(1,c.lessons));
  const getWeek=()=>Array.from({length:7},(_,i)=>addDays(i-6));
  const weeklyMinutes=()=>getWeek().reduce((s,d)=>s+(Number(data.activity[d])||0),0);
  const fmtHours=m=>`${(m/60).toFixed(1)}h`;
  const streak=()=>{let count=0,d=new Date();if(!(Number(data.activity[dateISO(d)])>0))d.setDate(d.getDate()-1);while(Number(data.activity[dateISO(d)])>0){count++;d.setDate(d.getDate()-1)}return count};
  const lastWeekMinutes=()=>getWeek().reduce((s,d)=>s+(Number(data.activity[d])||0),0);
  const courseCount=()=>data.courses.filter(c=>Number(c.completed||0)<Number(c.lessons||1)).length;
  const studyDays=()=>Object.keys(data.activity).filter(k=>Number(data.activity[k])>0).length;
  const initials=name=>String(name||'Learner').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join('');
  const greeting=()=>{const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'};
  const headings={overview:'Overview',courses:'My Courses',planner:'Study Planner',notes:'My Notes',materials:'Materials',settings:'Settings',course:'Course Details',search:'Search Results'};
  function toast(message,isError=false){const el=$('#toast');el.innerHTML=`${icon(isError?'x':'check')} ${esc(message)}`;el.classList.toggle('error',isError);el.classList.add('show');clearTimeout(toastId);toastId=setTimeout(()=>el.classList.remove('show'),2900)}
  function navigate(next){if(next!=='search'){$('#globalSearch').value='';searchTerm=''}view=next;notifOpen=false;render();window.scrollTo({top:0,behavior:'smooth'})}
  function renderNav(){const items=[['overview','squares','Overview'],['courses','book','My courses'],['planner','calendar','Study planner'],['notes','note','My notes'],['materials','folder','Materials']];$('#primaryNav').innerHTML=items.map(([key,ico,label])=>`<button class="nav-link ${view===key||(view==='course'&&key==='courses')?'active':''}" data-action="navigate" data-view="${key}" ${view===key?'aria-current="page"':''}>${icon(ico)}<span>${label}</span>${key==='planner'?`<small class="nav-count">${data.tasks.filter(t=>!t.done).length}</small>`:''}</button>`).join('');document.querySelectorAll('.sidebar [data-view="settings"]').forEach(b=>b.classList.toggle('active',view==='settings'))}

  // Files use IndexedDB, separately from the text metadata in localStorage.
  const MATERIALS_DB='learnspace-materials-v1';
  let materialDbPromise=null,materials=[],materialsReady=false,materialsError='',materialSearch='',materialsBusy=false;
  let materialCourseFilter='all',materialWeekFilter='all',uploadCourse='',uploadWeek='',uploadStatus='';
  const niceSize=bytes=>{bytes=Number(bytes)||0;return bytes<1024?`${bytes} B`:bytes<1048576?`${(bytes/1024).toFixed(1)} KB`:bytes<1073741824?`${(bytes/1048576).toFixed(1)} MB`:`${(bytes/1073741824).toFixed(2)} GB`};
  function materialKind(m){const t=(m.type||'').toLowerCase(),n=(m.name||'').toLowerCase();return t.startsWith('image/')?'image':t.includes('pdf')||n.endsWith('.pdf')?'pdf':'file'}
  function openMaterialDb(){if(materialDbPromise)return materialDbPromise;materialDbPromise=new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){reject(Error('IndexedDB is unavailable in this browser.'));return}
    let request;try{request=indexedDB.open(MATERIALS_DB,1)}catch(e){reject(e);return}
    request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains('materials'))db.createObjectStore('materials',{keyPath:'id'})};
    request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||Error('Cannot open file storage'));
    request.onblocked=()=>reject(Error('Local file storage is blocked by another tab.'));
  }).catch(e=>{materialDbPromise=null;throw e});return materialDbPromise}
  async function materialTransaction(mode,operation){const db=await openMaterialDb();return new Promise((resolve,reject)=>{const tx=db.transaction('materials',mode);const req=operation(tx.objectStore('materials'));let result;req.onsuccess=()=>{result=req.result};req.onerror=()=>reject(req.error||Error('File operation failed'));tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error||Error('File storage error'));tx.onabort=()=>reject(tx.error||Error('File storage interrupted'))})}
  async function refreshMaterials(){try{materials=(await materialTransaction('readonly',store=>store.getAll())).map(({file,...m})=>m).sort((a,b)=>b.addedAt-a.addedAt);materialsError=''}catch(e){materialsError='Materials could not be loaded: '+e.message}materialsReady=true;if(view==='materials'||view==='search')render()}
  const courseOptions=(selected='',allowAll=false)=>`${allowAll?'<option value="all">All courses</option>':'<option value="">Unassigned / general</option>'}${data.courses.map(c=>`<option value="${esc(c.id)}" ${selected===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}`;
  function weekOptions(courseId,selected='',allowAll=false){const course=courseOf(courseId),limit=course?Number(course.weeks)||12:52,largest=Math.max(limit,...materials.filter(m=>courseId==='all'||m.courseId===courseId).map(m=>Number(m.week)||0),Number(selected)||0);return `${allowAll?`<option value="all" ${selected==='all'?'selected':''}>All weeks</option>`:''}<option value="" ${selected===''?'selected':''}>General / no week</option>${Array.from({length:Math.min(104,largest)},(_,i)=>`<option value="${i+1}" ${String(selected)===String(i+1)?'selected':''}>Week ${i+1}</option>`).join('')}`}
  function filteredMaterials(){const q=materialSearch.trim().toLowerCase();return materials.filter(m=>(materialCourseFilter==='all'||(m.courseId||'')===materialCourseFilter)&&(materialWeekFilter==='all'||String(m.week||'')===materialWeekFilter)&&(!q||m.name.toLowerCase().includes(q)||(courseOf(m.courseId)?.title||'').toLowerCase().includes(q)))}
  function updateUploadStatus(message){uploadStatus=message;const el=$('#materialUploadStatus');if(el)el.textContent=message}
  async function uploadMaterials(files){files=Array.from(files||[]).filter(f=>f instanceof File);if(!files.length||materialsBusy)return;
    const courseId=uploadCourse,week=uploadWeek;materialsBusy=true;$('#materialDropzone')?.setAttribute('aria-busy','true');let count=0,duplicates=0,errors=[];
    try{
      for(let i=0;i<files.length;i++){
        const file=files[i];updateUploadStatus(`Saving ${i+1} of ${files.length}: ${file.name}`);
        if(file.size>250*1024*1024){errors.push(`${file.name} exceeds the 250 MB per-file limit`);continue}
        if(materials.some(m=>m.name===file.name&&m.size===file.size&&String(m.courseId||'')===courseId&&String(m.week||'')===week&&m.lastModified===file.lastModified)){duplicates++;continue}
        try{const m={id:uid(),name:file.name||'Untitled file',type:file.type||'',size:file.size,courseId,week,sessionDate:dateISO(),addedAt:Date.now()+i,lastModified:file.lastModified||0,file};await materialTransaction('readwrite',store=>store.put(m));materials.push({...m,file:undefined});count++}catch(e){errors.push(`${file.name}: ${e.name==='QuotaExceededError'?'browser storage is full':e.message}`)}
      }
    }finally{materialsBusy=false;await refreshMaterials();const picker=$('#materialUpload');if(picker)picker.value='';$('#materialDropzone')?.setAttribute('aria-busy','false')}
    updateUploadStatus(`${count} saved${duplicates?`, ${duplicates} duplicate${duplicates===1?'':'s'} skipped`:''}${errors.length?`, ${errors.length} failed`:''}.`);
    toast(errors.length?`Some files could not be saved: ${errors[0]}`:`${count} file${count===1?'':'s'} saved${duplicates?` (${duplicates} duplicate${duplicates===1?'':'s'} skipped)`:''}`,!!errors.length);
  }
  async function downloadMaterial(id){try{const record=await materialTransaction('readonly',store=>store.get(id));if(!record||!record.file){toast('This file is unavailable.',true);return}const url=URL.createObjectURL(record.file);const link=document.createElement('a');link.href=url;link.download=record.name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){toast('Could not download the file.',true)}}
  async function deleteMaterial(id){const m=materials.find(m=>m.id===id);if(!m||!confirm(`Permanently delete “${m.name}”?`))return;try{await materialTransaction('readwrite',store=>store.delete(id));await refreshMaterials();toast('Material deleted')}catch(e){toast(`Could not delete the file: ${e.message}`,true)}}
  async function updateMaterial(id,name,courseId,week){try{const record=await materialTransaction('readonly',store=>store.get(id));if(!record)throw Error('The file could not be found');record.name=name;record.courseId=courseId;record.week=week;await materialTransaction('readwrite',store=>store.put(record));await refreshMaterials();toast('Material updated')}catch(e){toast(`Could not update material: ${e.message}`,true)}}
  async function deleteCourse(id){const c=courseOf(id);if(!c||!confirm(`Delete course “${c.title}”? Related tasks and notes will become personal; uploaded files will be kept.`))return;
    const attached=materials.filter(m=>m.courseId===id);
    // Remove the course link without deleting any uploaded file content.
    try{for(const m of attached){const rec=await materialTransaction('readonly',s=>s.get(m.id));if(rec){rec.courseId='';rec.week='';await materialTransaction('readwrite',s=>s.put(rec))}}}catch(e){toast('Course deletion stopped: files could not be reassigned.',true);return}
    data.courses=data.courses.filter(x=>x.id!==id);data.tasks.forEach(t=>{if(t.courseId===id)t.courseId=''});data.notes.forEach(n=>{if(n.courseId===id)n.courseId=''});
    if(selectedCourse===id)selectedCourse='';courseFilter='All';materialCourseFilter='all';materialWeekFilter='all';if(uploadCourse===id){uploadCourse='';uploadWeek=''}
    save();await refreshMaterials();navigate('courses');toast('Course deleted; related notes and files were kept');
  }
  function materialRows(){const entries=filteredMaterials();return entries.length?entries.map(m=>{const kind=materialKind(m),course=courseOf(m.courseId);return `<div class="material-row"><span class="material-symbol ${kind}">${icon(kind==='image'?'image':'file')}</span><div class="material-text"><strong title="${esc(m.name)}">${esc(m.name)}</strong><small>${esc(course?.title||'General')} · ${m.week?`Week ${esc(m.week)}`:'No week'} · ${niceSize(m.size)} · ${fmtDate(m.sessionDate||dateISO())}</small></div><div class="material-actions"><button data-action="edit-material" data-id="${esc(m.id)}" aria-label="Edit ${esc(m.name)}" title="Rename or move">${icon('edit')}</button><button data-action="download-material" data-id="${esc(m.id)}" aria-label="Download ${esc(m.name)}" title="Download">${icon('download')}</button><button class="mat-remove" data-action="delete-material" data-id="${esc(m.id)}" aria-label="Delete ${esc(m.name)}" title="Delete">${icon('trash')}</button></div></div>`}).join(''):empty('folder',materials.length?'No matching files':'No materials added yet',materials.length?'Change the course, week or search filters.':'Choose a course and week, then drop files above.')}
  function materialsPage(){const total=materials.reduce((n,m)=>n+(Number(m.size)||0),0);return `${header('Materials','Organize and manage files by course and week.',`<button class="btn btn-primary" data-action="upload-materials">${icon('plus')} Add files</button>`)}
    <div class="materials-intro"><div class="mat-stat">${icon('folder')} <strong>${materials.length}</strong> files saved</div><div class="mat-stat">${icon('file')} <strong>${niceSize(total)}</strong> used</div></div>
    <section class="materials-upload-panel"><div class="materials-upload-head"><div><h2>Add session materials</h2><p>Pick a course and week, then select files or drag them here.</p></div></div>
    <div class="materials-filterbar"><label class="select-field">Course<select id="materialCourse">${courseOptions(uploadCourse)}</select></label><label class="select-field">Week<select id="materialWeek">${weekOptions(uploadCourse,uploadWeek)}</select></label></div>
    ${materialsError?`<div class="mat-warning" role="alert">${esc(materialsError)}. Ensure browser site storage is enabled.</div>`:''}
    <input id="materialUpload" type="file" multiple hidden aria-label="Choose learning materials" />
    <div id="materialDropzone" class="materials-drop" role="button" tabindex="0" aria-busy="${materialsBusy}" aria-label="Drop files here or browse" data-action="upload-materials"><span class="upload-symbol">${icon('upload')}</span><strong>Drag & drop your materials here</strong><small>Documents, slides, PDFs, images and other files (up to 250 MB each)</small><span class="browse-cta">Browse files</span></div><p id="materialUploadStatus" class="upload-status" aria-live="polite">${esc(uploadStatus)}</p></section>
    <div class="materials-list-head"><h2>Your materials <span class="subcount">(${filteredMaterials().length})</span></h2><input class="materials-search" type="search" id="materialSearch" aria-label="Search materials" placeholder="Search materials..." value="${esc(materialSearch)}" /></div>
    <div class="materials-filterbar filter-under"><label class="select-field">Filter by course<select id="materialFilterCourse">${courseOptions(materialCourseFilter,true)}${materialCourseFilter===''?'<option value="" selected>Unassigned / general</option>':'<option value="">Unassigned / general</option>'}</select></label><label class="select-field">Filter by week<select id="materialFilterWeek">${weekOptions(materialCourseFilter,materialWeekFilter,true)}</select></label><button class="btn btn-outline btn-small" data-action="clear-material-filters">Clear filters</button></div>
    <div class="wide-panel"><div id="materialRows" class="material-rows">${materialsReady?materialRows():empty('folder','Loading materials','Reading saved files...')}</div></div>
    <p class="storage-note">All changes and files are stored persistently in this browser on this device. Clearing browser site data or using another device will not retain them. Back up important files.</p>`}
  function header(title,subtitle,action=''){return `<div class="page-heading"><div><p class="eyebrow">${esc(title==='Overview'?'Your learning dashboard':'Your personal workspace')}</p><h1>${esc(title)}</h1>${subtitle?`<p class="page-subtitle">${esc(subtitle)}</p>`:''}</div>${action||`<span class="heading-date">${icon('calendar')}${new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</span>`}</div>`}
  function hero(){return `<div class="hero"><div class="hero-content"><div class="hero-kicker">${icon('spark')} KEEP YOUR MOMENTUM</div><h2>Keep growing, one<br>lesson at a time.</h2><p>${data.courses.length?'Pick up where you left off and keep building on what you learn.':'Create your first course, add tasks and notes, and track study time in one place.'}</p><button data-action="${data.courses.length?'open-course':'new-course'}" ${data.courses.length?`data-id="${esc(data.courses.find(c=>c.completed<c.lessons)?.id||data.courses[0].id)}"`:''}>${data.courses.length?'Continue learning':'Create your first course'} ${icon('arrow')}</button></div><div class="hero-art" aria-hidden="true"><svg viewBox="0 0 265 220" xmlns="http://www.w3.org/2000/svg"><ellipse cx="138" cy="202" rx="117" ry="11" fill="#4d40c8" opacity=".19"/><path d="M51 112 143 49l84 62-88 61Z" fill="#d9d5ff"/><path d="M52 112 139 170v39l-88-62Z" fill="#b0a6fa"/><path d="M139 170 228 111v37l-89 61Z" fill="#8e80e9"/><path d="M78 112 143 68l57 42-62 43Z" fill="#f9f7ff"/><path d="M80 112 139 153v13l-59-40Z" fill="#cec6ff"/><path d="m139 153 62-43v13l-62 43Z" fill="#aaa0f1"/><path d="m98 110 45-31 40 29-45 31Z" fill="#faaf68"/><path d="m98 110 40 29v17l-40-28Z" fill="#e48f50"/><path d="m138 139 45-31v17l-45 31Z" fill="#f6a35a"/><path d="m109 105 34-23 28 20-34 24Z" fill="#fff6db"/><path d="m109 105 28 21v10l-28-20Z" fill="#d7d1ed"/><path d="m137 126 34-24v10l-34 24Z" fill="#e9e4ff"/><rect x="117" y="34" width="54" height="61" rx="8" transform="rotate(14 144 65)" fill="#4544a2"/><rect x="123" y="41" width="43" height="47" rx="5" transform="rotate(14 144 65)" fill="#fcfafc"/><path d="m134 57 14 4m-16 4 19 5m-22 3 14 4" stroke="#aaa2eb" stroke-width="3" stroke-linecap="round"/><circle cx="205" cy="46" r="14" fill="#ffe2a2"/><path d="M205 38v16m-8-8h16" stroke="#f4a947" stroke-width="2.5" stroke-linecap="round"/><path d="m47 52 3-10 3 10 10 3-10 3-3 10-3-10-10-3Z" fill="#fff0b5"/><circle cx="223" cy="88" r="3" fill="#e9e5ff"/><circle cx="66" cy="92" r="3" fill="#fbe4ac"/></svg></div></div>`}
  function statCard(ico,tint,value,label,chip){return `<article class="stat-card"><div class="stat-head"><span class="stat-icon ${tint}">${icon(ico)}</span>${chip?`<span class="stat-chip">${esc(chip)}</span>`:''}</div><h3>${value}</h3><p>${label}</p></article>`}
  function courseCard(c){const p=progress(c);return `<article class="course-card"><div class="course-top"><span class="course-symbol ${esc(c.color)}">${icon(c.symbol)}</span><span class="pill">${esc(c.category)}</span></div><div class="course-utility"><button data-action="edit-course" data-id="${esc(c.id)}" aria-label="Edit ${esc(c.title)}" title="Edit course">${icon('edit')}</button><button data-action="delete-course" data-id="${esc(c.id)}" aria-label="Delete ${esc(c.title)}" title="Delete course">${icon('trash')}</button></div><h3>${esc(c.title)}</h3><p class="course-topic">${esc(c.topic)}</p><div class="progress-line"><div class="progress-fill ${esc(c.color)}" style="width:${p}%"></div></div><div class="course-progress"><span>Course progress</span><strong>${p}%</strong></div><div class="course-card-foot"><span>${icon('book')} ${c.completed}/${c.lessons} lessons</span><button data-action="open-course" data-id="${esc(c.id)}">${p===100?'Review':'Continue'} ${icon('arrow')}</button></div></article>`}
  function taskRow(t,wide=false){const c=courseOf(t.courseId);return `<div class="${wide?'planner-row':'task-row'} ${t.done?'done':''}"><button class="task-checkbox ${t.done?'done':''}" data-action="toggle-task" data-id="${esc(t.id)}" aria-label="${t.done?'Mark incomplete':'Complete task'}: ${esc(t.title)}">${t.done?icon('check'):''}</button><div class="task-row-body"><strong>${esc(t.title)}</strong><small>${esc(c?.title||'Personal')} · ${t.due===dateISO()?'Today':fmtDate(t.due,{month:'short',day:'numeric',year:'numeric'})}</small></div><span class="priority ${esc((t.priority||'Medium').toLowerCase())}">${esc(t.priority||'Medium')}</span><div class="task-actions"><button class="mini-delete" title="Edit task" aria-label="Edit ${esc(t.title)}" data-action="edit-task" data-id="${esc(t.id)}">${icon('edit')}</button><button class="mini-delete" title="Delete task" aria-label="Delete ${esc(t.title)}" data-action="delete-task" data-id="${esc(t.id)}">${icon('trash')}</button></div></div>`}
  function activityChart(){const keys=getWeek(),vals=keys.map(k=>Number(data.activity[k])||0),max=Math.max(105,...vals);return `<div class="chart-caption"><div><strong>${fmtHours(weeklyMinutes())}</strong> <small>last 7 days</small></div><span class="trend">${icon('up')} Your study journey</span></div><div class="chart-bars">${keys.map((k,i)=>`<div class="bar-col ${i===6?'today':''}" style="--bar-height:${Math.max(0,Math.round(vals[i]/max*100))}%"><span class="bar-tip">${vals[i]} minutes</span><div class="bar-fill" title="${vals[i]} minutes"></div></div>`).join('')}</div><div class="chart-labels">${keys.map((k,i)=>`<span class="${i===6?'today':''}">${parseDate(k).toLocaleDateString('en-US',{weekday:'short'})}</span>`).join('')}</div>`}
  function overview(){const incomplete=data.tasks.filter(t=>!t.done).sort((a,b)=>a.due.localeCompare(b.due));const name=(data.profile.name||'Learner').trim().split(/\s+/)[0];const goal=Number(data.profile.weeklyGoal)||0;return `${header(`${greeting()}, ${name}!`,'Here’s what’s happening with your learning today.')}${hero()}<div class="stat-grid">${statCard('clock','violet-tint',fmtHours(weeklyMinutes()),'Study time · last 7 days',goal?`${Math.round(weeklyMinutes()/(goal*60)*100)}% of goal`:'')}${statCard('book','blue-tint',courseCount(),'Courses in progress')}${statCard('check','mint-tint',data.tasks.filter(t=>t.done).length,'Tasks completed')}${statCard('flame','peach-tint',`${streak()} ${streak()===1?'day':'days'}`,'Learning streak')}</div><div class="section-head"><h2>Continue learning</h2><button class="text-button" data-action="navigate" data-view="courses">View all courses ${icon('arrow')}</button></div>${data.courses.length?`<div class="course-grid">${data.courses.slice(0,3).map(courseCard).join('')}</div>`:empty('book','No courses yet','Create a course to track lessons and organize materials.')}<div class="lower-grid"><section class="panel"><div class="panel-head"><h2>Upcoming tasks</h2><button class="text-button" data-action="navigate" data-view="planner">View all ${icon('arrow')}</button></div><div class="task-list">${incomplete.length?incomplete.slice(0,4).map(t=>taskRow(t)).join(''):'<div class="empty">No upcoming tasks. Add one in Study planner.</div>'}</div></section><section class="panel"><div class="panel-head"><h2>Study activity</h2><button class="text-button" data-action="edit-study-time">Log / edit time ${icon('arrow')}</button></div>${activityChart()}</section></div>`}
  function coursePage(){const categories=['All',...new Set(data.courses.map(c=>c.category))];const filtered=data.courses.filter(c=>courseFilter==='All'||c.category===courseFilter);return `${header('My courses','Explore your classes and pick up right where you left off.',`<button class="btn btn-primary" data-action="new-course">${icon('plus')} New course</button>`)}<div class="page-tools"><div class="filter-group">${categories.map(c=>`<button class="filter-pill ${courseFilter===c?'active':''}" data-action="course-filter" data-filter="${esc(c)}">${esc(c)}</button>`).join('')}</div><span style="font-size:11px;color:var(--muted)">${filtered.length} courses</span></div><div class="course-grid full-course-grid">${filtered.map(courseCard).join('')}</div>${!filtered.length?empty('book','No courses in this category','Start by adding a course.'):''}`}
  function plannerPage(){let tasks=[...data.tasks].sort((a,b)=>a.due.localeCompare(b.due));if(taskFilter==='Upcoming')tasks=tasks.filter(t=>!t.done);if(taskFilter==='Completed')tasks=tasks.filter(t=>t.done);if(taskFilter==='Selected day')tasks=tasks.filter(t=>t.due===selectedDay);return `${header('Study planner','Stay on top of deadlines and keep your priorities clear.',`<button class="btn btn-primary" data-action="new-task">${icon('plus')} Add task</button>`)}<div class="page-tools"><div class="filter-group">${['Upcoming','All','Completed','Selected day'].map(f=>`<button class="filter-pill ${taskFilter===f?'active':''}" data-action="task-filter" data-filter="${f}">${f==='Selected day'?'Selected day':f}</button>`).join('')}</div>${taskFilter==='Selected day'?`<span style="font-size:11px;color:var(--muted)">${fmtDate(selectedDay,{month:'long',day:'numeric'})}</span>`:`<span style="font-size:11px;color:var(--muted)">${tasks.length} tasks</span>`}</div><div class="wide-panel">${tasks.length?tasks.map(t=>taskRow(t,true)).join(''):empty('check','Nothing on your list','Add a task to plan your next study session.')}</div>`}
  function notesPage(){return `${header('My notes','All your ideas and learning insights, in one place.',`<button class="btn btn-primary" data-action="new-note">${icon('plus')} New note</button>`)}<div class="notes-grid">${[...data.notes].sort((a,b)=>b.updated.localeCompare(a.updated)).map(n=>{const c=courseOf(n.courseId);return `<article class="note-card"><div class="course-top"><span class="course-symbol ${esc(c?.color||'violet')}">${icon('note')}</span><span class="pill">${esc(c?.category||'Personal')}</span></div><h3>${esc(n.title)}</h3><p>${esc(n.content)}</p><div class="note-foot"><span>Edited ${fmtDate(n.updated)}</span><div class="note-actions"><button data-action="edit-note" data-id="${esc(n.id)}" aria-label="Edit ${esc(n.title)}" title="Edit note">${icon('edit')}</button><button data-action="delete-note" data-id="${esc(n.id)}" aria-label="Delete ${esc(n.title)}" title="Delete note">${icon('trash')}</button></div></div></article>`}).join('')}</div>${!data.notes.length?empty('note','No notes yet','Capture something new from your next lesson.'):''}`}
  function detailPage(){const c=courseOf(selectedCourse);if(!c)return coursePage();const p=progress(c);return `${header('Course details',c.category,`<button class="btn btn-outline" data-action="navigate" data-view="courses">${icon('left')} All courses</button>`)}<div class="course-detail-banner"><span class="course-symbol ${esc(c.color)}">${icon(c.symbol)}</span><div style="flex:1;min-width:0"><h2>${esc(c.title)}</h2><p>${esc(c.description||'No description yet.')}</p><div class="progress-line"><div class="progress-fill ${esc(c.color)}" style="width:${p}%"></div></div><div class="course-progress" style="max-width:400px"><span>${c.completed} of ${c.lessons} lessons completed · ${c.weeks||12} weeks</span><strong>${p}%</strong></div><div class="detail-actions"><button class="btn btn-outline btn-small" data-action="edit-course" data-id="${esc(c.id)}">${icon('edit')} Edit course</button><button class="btn btn-danger btn-small" data-action="delete-course" data-id="${esc(c.id)}">${icon('trash')} Delete course</button></div></div></div><div class="wide-panel"><div class="panel-head"><h2>Your learning path</h2><div class="detail-actions"><button class="btn btn-outline btn-small" ${c.completed<=0?'disabled':''} data-action="undo-lesson" data-id="${esc(c.id)}">Undo lesson</button><button class="btn btn-primary btn-small" ${p>=100?'disabled':''} data-action="next-lesson" data-id="${esc(c.id)}">${icon('check')} ${p>=100?'Course completed':'Complete next lesson'}</button></div></div><div class="lesson-list">${(c.modules?.length?c.modules:['Getting started']).map((m,i)=>{const done=c.completed>=Math.ceil((i+1)*c.lessons/(c.modules?.length||1));return `<div class="lesson-item"><span class="lesson-num ${done?'completed':''}">${done?icon('check'):String(i+1).padStart(2,'0')}</span><div><strong>${esc(m)}</strong><p>${done?'Completed':'Not yet completed'}</p></div></div>`}).join('')}</div></div>`}
  function settingsPage(){return `${header('Settings','Your profile, preferences and locally saved data.')}<div class="wide-panel"><div class="setting-row"><div><strong>Profile</strong><p>${esc(data.profile.name)} · ${data.profile.weeklyGoal?`${esc(data.profile.weeklyGoal)} hours weekly target`:'No weekly time goal set'}</p></div><button class="btn btn-outline btn-small" data-action="edit-profile">${icon('edit')} Edit profile</button></div><div class="setting-row"><div><strong>Dark mode</strong><p>Switch between light and dark appearance.</p></div><button class="switch ${data.profile.theme==='dark'?'on':''}" data-action="toggle-theme" aria-label="Toggle dark mode" aria-pressed="${data.profile.theme==='dark'}"></button></div><div class="setting-row"><div><strong>Study time</strong><p>${studyDays()} recorded study days. Log minutes manually or use the focus timer.</p></div><button class="btn btn-outline btn-small" data-action="edit-study-time">${icon('clock')} Log / edit time</button></div><div class="setting-row"><div><strong>Local persistence</strong><p>Courses, tasks, notes and study time are saved in browser local storage. Files are stored in IndexedDB and survive reloads and browser restarts when site data is retained. Data is not synced between devices.</p></div><span class="pill">This browser</span></div><div class="setting-row"><div><strong>Export learning data</strong><p>Download a JSON backup of courses, tasks, notes and study-time data (file attachments not included).</p></div><button class="btn btn-outline btn-small" data-action="export-data">${icon('download')} Export data</button></div><div class="setting-row"><div><strong>Reset learning data</strong><p>Remove courses, tasks, notes and study-time history. Uploaded materials are kept but changed to unassigned.</p></div><button class="btn btn-danger btn-small" data-action="reset-data">Reset data</button></div></div>`}
  function empty(ico,title,body){return `<div class="empty">${icon(ico)}<strong>${esc(title)}</strong><p>${esc(body)}</p></div>`}
  function searchPage(){const q=searchTerm.toLowerCase();const found=[...data.courses.filter(c=>[c.title,c.category,c.topic,c.description].some(x=>x.toLowerCase().includes(q))).map(c=>({type:'Course',icon:'book',title:c.title,sub:c.category,id:c.id,action:'open-course'})),...data.tasks.filter(t=>t.title.toLowerCase().includes(q)).map(t=>({type:'Task',icon:'calendar',title:t.title,sub:fmtDate(t.due),id:t.id,action:'navigate',page:'planner'})),...data.notes.filter(n=>[n.title,n.content].some(x=>x.toLowerCase().includes(q))).map(n=>({type:'Note',icon:'note',title:n.title,sub:'Your personal notes',id:n.id,action:'edit-note'}))];return `${header('Search results',`Results for “${searchTerm}”`)}<div class="wide-panel">${found.length?found.map(f=>`<div class="search-result" data-action="${f.action}" ${f.page?`data-view="${f.page}"`:''} data-id="${esc(f.id)}">${icon(f.icon)}<div><strong>${esc(f.title)}</strong><small>${esc(f.type)} · ${esc(f.sub)}</small></div><span style="margin-left:auto">${icon('right')}</span></div>`).join(''):empty('search','No matching results','Try another search term.')}</div>`}
  function calendarMarkup(){const month=monthCursor.getMonth(),year=monthCursor.getFullYear(),first=new Date(year,month,1),offset=(first.getDay()+6)%7,days=new Date(year,month+1,0).getDate();let cells=Array.from({length:Math.ceil((offset+days)/7)*7},(_,i)=>{const d=new Date(year,month,i-offset+1),day=dateISO(d),outside=d.getMonth()!==month,has=data.tasks.some(t=>t.due===day&&!t.done);return `<button class="day ${outside?'outside':''} ${day===dateISO()?'today':''} ${day===selectedDay?'selected':''} ${has?'has-task':''}" data-action="choose-day" data-day="${day}" aria-label="${fmtDate(day,{weekday:'long',month:'long',day:'numeric'})}" ${day===selectedDay?'aria-pressed="true"':''}>${d.getDate()}</button>`});return `<section class="rail-calendar"><div class="rail-heading"><h2>Calendar</h2>${icon('calendar')}</div><div class="calendar-month"><strong>${first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</strong><div class="calendar-arrows"><button data-action="prev-month" aria-label="Previous month">${icon('left')}</button><button data-action="next-month" aria-label="Next month">${icon('right')}</button></div></div><div class="calendar-grid">${['Mo','Tu','We','Th','Fr','Sa','Su'].map(x=>`<span class="calendar-weekday">${x}</span>`).join('')}${cells.join('')}</div></section>`}
  const timerText=()=>`${String(Math.floor(timerSeconds/60)).padStart(2,'0')}:${String(timerSeconds%60).padStart(2,'0')}`;
  function focusMarkup(){const pct=Math.min(100,(timerLength*60-timerSeconds)/(timerLength*60)*100);return `<section class="focus-panel"><div class="focus-top"><h3>Focus timer</h3><select id="timerDuration" aria-label="Focus duration"><option value="15" ${timerLength===15?'selected':''}>15 min</option><option value="25" ${timerLength===25?'selected':''}>25 min</option><option value="45" ${timerLength===45?'selected':''}>45 min</option><option value="60" ${timerLength===60?'selected':''}>60 min</option></select></div><div class="timer-circle" id="timerRing" style="--timer-progress:${pct}%"><div class="timer-inner"><strong id="timerDisplay">${timerText()}</strong><small>Stay focused</small></div></div><div class="timer-controls"><button class="timer-side" data-action="timer-reset" aria-label="Reset timer" title="Reset timer">${icon('reset')}</button><button class="timer-main" id="timerPlay" data-action="timer-play">${icon(timerRunning?'pause':'play')} ${timerRunning?'Pause':'Start focus'}</button><button class="timer-side" data-action="timer-finish" aria-label="Finish and log session" title="Finish and log session">${icon('check')}</button></div><p class="focus-note">Minimize distractions. Maximize progress.</p></section>`}
  function upcomingMarkup(){const tasks=data.tasks.filter(t=>!t.done).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,3);return `<section><div class="upcoming-head"><h3>Upcoming deadlines</h3><button class="text-button" data-action="navigate" data-view="planner">See all</button></div><div class="deadline-list">${tasks.map(t=>`<div class="deadline"><div class="deadline-date"><small>${parseDate(t.due).toLocaleDateString('en-US',{month:'short'})}</small><strong>${parseDate(t.due).getDate()}</strong></div><div class="deadline-info"><strong>${esc(t.title)}</strong><small>${esc(courseOf(t.courseId)?.title||'Personal')}</small></div></div>`).join('')||'<p style="color:var(--muted);font-size:12px">No upcoming deadlines.</p>'}</div></section>`}
  function renderRail(){const rail=$('#rightRail');rail.innerHTML=calendarMarkup()+focusMarkup()+upcomingMarkup()}
  function render(){document.body.classList.toggle('dark',data.profile.theme==='dark');const profileName=$('.sidebar-profile strong'),profileIcon=$('.sidebar-profile .avatar');if(profileName)profileName.textContent=data.profile.name;if(profileIcon)profileIcon.textContent=initials(data.profile.name);renderNav();$('#crumb').textContent=headings[view]||'Overview';$('#pageContent').innerHTML=({overview, courses:coursePage,planner:plannerPage,notes:notesPage,materials:materialsPage,settings:settingsPage,course:detailPage,search:searchPage}[view]||overview)();renderRail();$('#notifDot').style.display=data.tasks.some(t=>!t.done&&t.due<=addDays(1))?'block':'none';renderNotifications()}
  function renderNotifications(){const el=$('#notificationArea');if(!notifOpen){el.innerHTML='';return}const tasks=data.tasks.filter(t=>!t.done&&t.due<=addDays(2)).sort((a,b)=>a.due.localeCompare(b.due));el.innerHTML=`<div class="notif-popover"><h3>Notifications</h3>${tasks.length?tasks.map(t=>`<div class="notif-item"><span class="stat-icon peach-tint">${icon('bell')}</span><div><strong>${esc(t.title)}</strong><small>${t.due<dateISO()?'Overdue':t.due===dateISO()?'Due today':`Due ${fmtDate(t.due)}`}</small></div></div>`).join(''):'<p style="font-size:12px;color:var(--muted)">You’re all caught up.</p>'}<button class="text-button" data-action="navigate" data-view="planner">Open study planner ${icon('arrow')}</button></div>`}
  function modal(kind,id){let title,intro,fields,mode=kind;
    if(kind==='task'){const t=data.tasks.find(t=>t.id===id);title=t?'Edit task':'Add a new task';intro='Create or update a step in your study plan.';fields=`<div class="field"><label for="taskTitle">Task name</label><input id="taskTitle" name="title" maxlength="120" required value="${esc(t?.title||'')}" placeholder="e.g. Prepare for the next lesson" /></div><div class="field"><label for="taskCourse">Course</label><select name="courseId" id="taskCourse"><option value="">Personal task</option>${data.courses.map(c=>`<option value="${esc(c.id)}" ${t?.courseId===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div><div class="field-row"><div class="field"><label for="taskDue">Due date</label><input id="taskDue" type="date" name="due" required value="${esc(t?.due||selectedDay)}"/></div><div class="field"><label for="taskPriority">Priority</label><select name="priority" id="taskPriority">${['Low','Medium','High'].map(p=>`<option ${p===(t?.priority||'Medium')?'selected':''}>${p}</option>`).join('')}</select></div></div>`}
    else if(kind==='course'){const c=courseOf(id);title=c?'Edit course':'Create a course';intro='Configure lessons, weeks and learning modules.';fields=`<div class="field"><label for="courseTitle">Course title</label><input id="courseTitle" name="title" required maxlength="100" value="${esc(c?.title||'')}" placeholder="e.g. Photography basics" /></div><div class="field"><label for="courseCategory">Category</label><select name="category" id="courseCategory">${[...new Set(['Design','Development','Languages','Other',c?.category].filter(Boolean))].map(x=>`<option ${x===c?.category?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field-row"><div class="field"><label for="courseLessons">Total lessons</label><input id="courseLessons" name="lessons" type="number" min="1" max="1000" value="${Number(c?.lessons)||12}" required /></div><div class="field"><label for="courseCompleted">Completed lessons</label><input id="courseCompleted" name="completed" type="number" min="0" max="1000" value="${Number(c?.completed)||0}" required /></div><div class="field"><label for="courseWeeks">Number of weeks</label><input id="courseWeeks" name="weeks" type="number" min="1" max="104" value="${Number(c?.weeks)||12}" required /></div></div><div class="field"><label for="courseDescription">Description</label><textarea id="courseDescription" name="description" rows="2" placeholder="What are you learning?">${esc(c?.description||'')}</textarea></div><div class="field"><label for="courseModules">Module names (one per line)</label><textarea id="courseModules" name="modules" rows="4" placeholder="Introduction&#10;Practice&#10;Final project">${esc((c?.modules||[]).join('\n'))}</textarea></div>`}
    else if(kind==='note'){const n=data.notes.find(n=>n.id===id);title=n?'Edit note':'New note';intro='Capture and organize what you have learned.';fields=`<div class="field"><label for="noteTitle">Title</label><input id="noteTitle" name="title" required maxlength="120" value="${esc(n?.title||'')}" placeholder="What did you learn?"/></div><div class="field"><label for="noteCourse">Related course</label><select id="noteCourse" name="courseId"><option value="">Personal note</option>${data.courses.map(c=>`<option value="${esc(c.id)}" ${n?.courseId===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div><div class="field"><label for="noteContent">Your notes</label><textarea id="noteContent" name="content" required placeholder="Write down your thoughts here...">${esc(n?.content||'')}</textarea></div>`}
    else if(kind==='material'){const m=materials.find(m=>m.id===id);if(!m)return;title='Edit material';intro='Rename this file or move it to another course and week. Its contents stay unchanged.';fields=`<div class="field"><label for="materialNameEdit">File name</label><input id="materialNameEdit" name="title" required maxlength="255" value="${esc(m.name)}" /></div><div class="field"><label for="materialCourseEdit">Course</label><select name="courseId" id="materialCourseEdit">${courseOptions(m.courseId||'')}</select></div><div class="field"><label for="materialWeekEdit">Week</label><select name="week" id="materialWeekEdit">${weekOptions(m.courseId||'',String(m.week||''))}</select></div>`}
    else if(kind==='profile'){title='Edit profile';intro='Set a name and optional weekly study target.';fields=`<div class="field"><label for="profileName">Display name</label><input id="profileName" name="title" required maxlength="80" value="${esc(data.profile.name)}"/></div><div class="field"><label for="profileGoal">Weekly goal (hours; 0 to disable)</label><input id="profileGoal" name="weeklyGoal" type="number" min="0" max="168" step="0.5" value="${Number(data.profile.weeklyGoal)||0}" required /></div>`}
    else if(kind==='time'){title='Log / edit study time';intro='Edit the total studied minutes for any day. Set to zero to remove that day from the streak and chart.';fields=`<div class="field"><label for="studyDate">Study date</label><input id="studyDate" name="studyDate" type="date" max="${dateISO()}" value="${dateISO()}" required /></div><div class="field"><label for="studyMinutes">Total minutes studied on this date</label><input id="studyMinutes" name="studyMinutes" type="number" min="0" max="1440" value="${Number(data.activity[dateISO()])||0}" required /></div><p class="storage-note">Saving replaces the daily total, rather than adding to it.</p>`}
    $('#modalRoot').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-heading"><h2 id="modalTitle">${title}</h2><button class="close-btn" data-action="close-modal" aria-label="Close dialog">${icon('x')}</button></div><p class="modal-intro">${intro}</p><form id="entryForm" data-form="${mode}" data-id="${esc(id||'')}">${fields}<div class="modal-actions"><button type="button" class="btn btn-outline" data-action="close-modal">Cancel</button><button type="submit" class="btn btn-primary">${icon('check')} ${id||['profile','time'].includes(kind)?'Save changes':'Create'}</button></div></form></div></div>`;
    setTimeout(()=>$('#modalRoot input:not([type="date"]),#modalRoot textarea')?.focus(),0);
  }
  function closeModal(){$('#modalRoot').innerHTML=''}
  function logSession(minutes){const day=dateISO();data.activity[day]=(Number(data.activity[day])||0)+minutes;data.sessions=(data.sessions||0)+1;save();toast(`${minutes} minute${minutes===1?'':'s'} added to study activity`);render()}
  function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}timerRunning=false}
  function syncTimer(){const display=$('#timerDisplay'),ring=$('#timerRing'),play=$('#timerPlay');if(display)display.textContent=timerText();if(ring)ring.style.setProperty('--timer-progress',`${Math.min(100,(timerLength*60-timerSeconds)/(timerLength*60)*100)}%`);if(play)play.innerHTML=`${icon(timerRunning?'pause':'play')} ${timerRunning?'Pause':'Start focus'}`}
  function advanceCourse(id){const c=courseOf(id);if(!c)return;if(c.completed>=c.lessons){toast('Course already completed');return}c.completed++;save();render();toast(c.completed===c.lessons?'Course completed!':'Lesson marked complete')}
  function chooseDay(day){selectedDay=day;monthCursor=new Date(parseDate(day).getFullYear(),parseDate(day).getMonth(),1);taskFilter='Selected day';navigate('planner')}
  document.addEventListener('click',e=>{
    if(e.target.id==='modalBackdrop'){closeModal();return}
    if(notifOpen&&!e.target.closest('.notif-popover')&&!e.target.closest('#notificationButton')){notifOpen=false;renderNotifications()}
    const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
    if(a==='navigate')navigate(b.dataset.view);
    else if(a==='open-course'){selectedCourse=id;navigate('course')}
    else if(a==='next-lesson')advanceCourse(id);
    else if(a==='new-task')modal('task');
    else if(a==='edit-task')modal('task',id);
    else if(a==='new-course')modal('course');
    else if(a==='edit-course')modal('course',id);
    else if(a==='delete-course')deleteCourse(id);
    else if(a==='undo-lesson'){const c=courseOf(id);if(c&&c.completed>0){c.completed--;save();render();toast('Lesson progress updated')}}
    else if(a==='new-note')modal('note');
    else if(a==='edit-profile')modal('profile');
    else if(a==='edit-study-time')modal('time');
    else if(a==='export-data'){const blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`learnspace-backup-${dateISO()}.json`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Learning data exported (attachments excluded)')}
    else if(a==='upload-materials')$('#materialUpload')?.click();
    else if(a==='download-material')downloadMaterial(id);
    else if(a==='delete-material')deleteMaterial(id);
    else if(a==='edit-material')modal('material',id);
    else if(a==='clear-material-filters'){materialCourseFilter='all';materialWeekFilter='all';materialSearch='';render()}
    else if(a==='edit-note')modal('note',id);
    else if(a==='close-modal')closeModal();
    else if(a==='toggle-task'){const t=data.tasks.find(t=>t.id===id);if(t){t.done=!t.done;save();render();toast(t.done?'Task completed':'Task marked as upcoming')}}
    else if(a==='delete-task'){if(confirm('Delete this task?')){data.tasks=data.tasks.filter(t=>t.id!==id);save();render();toast('Task deleted')}}
    else if(a==='delete-note'){if(confirm('Delete this note?')){data.notes=data.notes.filter(n=>n.id!==id);save();render();toast('Note deleted')}}
    else if(a==='course-filter'){courseFilter=b.dataset.filter;render()}
    else if(a==='task-filter'){taskFilter=b.dataset.filter;render()}
    else if(a==='prev-month'){monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()-1,1);renderRail()}
    else if(a==='next-month'){monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+1,1);renderRail()}
    else if(a==='choose-day')chooseDay(b.dataset.day);
    else if(a==='notifications'){notifOpen=!notifOpen;renderNotifications()}
    else if(a==='timer-play'){if(timerRunning){stopTimer();syncTimer()}else{if(timerSeconds===0)timerSeconds=timerLength*60;timerRunning=true;timerId=setInterval(()=>{timerSeconds=Math.max(0,timerSeconds-1);syncTimer();if(timerSeconds===0){stopTimer();logSession(timerLength);timerSeconds=timerLength*60;syncTimer()}},1000);syncTimer()}}
    else if(a==='timer-reset'){stopTimer();timerSeconds=timerLength*60;syncTimer();toast('Focus timer reset')}
    else if(a==='timer-finish'){const elapsed=Math.ceil((timerLength*60-timerSeconds)/60);if(elapsed<=0){toast('Start a focus session first');return}stopTimer();timerSeconds=timerLength*60;logSession(elapsed)}
    else if(a==='toggle-theme'){data.profile.theme=data.profile.theme==='dark'?'light':'dark';save();render()}
    else if(a==='reset-data'){if(confirm('Delete all courses, tasks, notes and study-time records? Uploaded files will be kept.')){stopTimer();timerSeconds=timerLength*60;data=seed();selectedCourse='';materialCourseFilter='all';materialWeekFilter='all';uploadCourse='';uploadWeek='';save();(async()=>{for(const m of materials.filter(m=>m.courseId)){const r=await materialTransaction('readonly',s=>s.get(m.id));if(r){r.courseId='';r.week='';await materialTransaction('readwrite',s=>s.put(r))}}await refreshMaterials()})().catch(()=>toast('Some file course labels could not be reset.',true));navigate('overview');toast('Learning data reset')}}
  });
  document.addEventListener('submit',e=>{if(e.target.id!=='entryForm')return;e.preventDefault();const f=e.target,form=new FormData(f),kind=f.dataset.form,id=f.dataset.id,title=String(form.get('title')||'').trim();
    if(!title&&!['time'].includes(kind))return;
    if(kind==='task'){
      let t=data.tasks.find(t=>t.id===id);const fields={title,courseId:String(form.get('courseId')||''),due:String(form.get('due')||dateISO()),priority:String(form.get('priority')||'Medium')};
      if(t)Object.assign(t,fields);else data.tasks.push({id:uid(),...fields,done:false});toast(t?'Task updated':'Task created');
    }else if(kind==='course'){
      const lessons=Math.max(1,Math.min(1000,Number(form.get('lessons'))||1)),completed=Math.max(0,Math.min(lessons,Number(form.get('completed'))||0)),weeks=Math.max(1,Math.min(104,Number(form.get('weeks'))||12)),category=String(form.get('category')||'Other');
      const metas={Design:['violet','palette'],Development:['orange','code'],Languages:['blue','language'],Other:['mint','book']};const [color,symbol]=metas[category]||metas.Other;
      let c=courseOf(id);const props={title,category,topic:category==='Other'?'Self-paced learning':category,color,symbol,lessons,completed,weeks,description:String(form.get('description')||'').trim(),modules:String(form.get('modules')||'').split('\n').map(x=>x.trim()).filter(Boolean)};
      if(c)Object.assign(c,props);else data.courses.push({id:uid(),...props});courseFilter='All';toast(c?'Course updated':'Course created');
    }else if(kind==='note'){
      let n=data.notes.find(n=>n.id===id);if(n){n.title=title;n.content=String(form.get('content')||'');n.courseId=String(form.get('courseId')||'');n.updated=dateISO();toast('Note updated')}else{data.notes.unshift({id:uid(),title,content:String(form.get('content')||''),courseId:String(form.get('courseId')||''),updated:dateISO()});toast('Note saved')}
    }else if(kind==='profile'){
      data.profile.name=title;data.profile.weeklyGoal=Math.max(0,Math.min(168,Number(form.get('weeklyGoal'))||0));toast('Profile updated');
    }else if(kind==='time'){
      const day=String(form.get('studyDate')||dateISO()),minutes=Math.max(0,Math.min(1440,Number(form.get('studyMinutes'))||0));if(day>dateISO()){toast('Study date cannot be in the future.',true);return}if(minutes===0)delete data.activity[day];else data.activity[day]=minutes;toast('Study time updated');
    }else if(kind==='material'){
      const c=String(form.get('courseId')||''),w=String(form.get('week')||'');closeModal();updateMaterial(id,title,c,w);return;
    }
    save();closeModal();render();
  });
  document.addEventListener('change',e=>{
    const el=e.target;
    if(el.id==='materialUpload'){uploadMaterials(el.files);return}
    if(el.id==='timerDuration'){stopTimer();timerLength=Number(el.value);timerSeconds=timerLength*60;syncTimer();return}
    if(el.id==='materialCourse'){uploadCourse=el.value;uploadWeek='';const week=$('#materialWeek');if(week)week.innerHTML=weekOptions(uploadCourse,uploadWeek);return}
    if(el.id==='materialFilterCourse'){materialCourseFilter=el.value;materialWeekFilter='all';render();return}
    if(el.id==='materialFilterWeek'){materialWeekFilter=el.value;render();return}
    if(el.id==='materialWeek'){uploadWeek=el.value;return}
    if(el.id==='materialCourseEdit'){const w=$('#materialWeekEdit');if(w)w.innerHTML=weekOptions(el.value,'');return}
    if(el.id==='studyDate'){const mins=$('#studyMinutes');if(mins)mins.value=Number(data.activity[el.value])||0;return}
  });
  document.addEventListener('input',e=>{if(e.target.id==='materialSearch'){materialSearch=e.target.value;const el=$('#materialRows');if(el)el.innerHTML=materialRows();const c=$('.subcount');if(c)c.textContent=`(${filteredMaterials().length})`}});
  document.addEventListener('dragover',e=>{if(e.dataTransfer?.types?.includes('Files')){e.preventDefault();if(view==='materials')$('#materialDropzone')?.classList.add('dragging')}});
  document.addEventListener('dragleave',e=>{if(e.relatedTarget===null)$('#materialDropzone')?.classList.remove('dragging')});
  document.addEventListener('drop',e=>{if(e.dataTransfer?.files?.length){e.preventDefault();$('#materialDropzone')?.classList.remove('dragging');if(view==='materials')uploadMaterials(e.dataTransfer.files)}});
  document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.id==='materialDropzone'){e.preventDefault();$('#materialUpload')?.click()}});
  $('#globalSearch').addEventListener('input',e=>{searchTerm=e.target.value.trim();if(searchTerm){if(view!=='search')previousView=view;view='search';render()}else if(view==='search'){view=previousView;render()}});
  document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch').focus();$('#globalSearch').select()}if(e.key==='Escape'){closeModal();if(notifOpen){notifOpen=false;renderNotifications()}}});
  render();
  refreshMaterials();
})();
</script>
</body>
</html>
